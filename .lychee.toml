# CI runs Lychee in an ephemeral container with the repository mounted
# read-only, so a persistent cache cannot be written and is not useful.
cache = false
max_retries = 2
timeout = 20
accept = [200, 206, 429]
exclude = [
  "https://github.com/SoBatista/sobatista-terminal/actions/.*",
  "https://github.com/SoBatista/sobatista-terminal/releases/tag/.*",
  "https://img.shields.io/.*",
  # Pre-release exception: the CHANGELOG "Unreleased" link compares against the
  # not-yet-created v0.1.0 tag, so GitHub returns 404 until the first release.
  # This is anchored to the exact planned first-release compare URL; remove or
  # reconsider it once v0.1.0 has been tagged.
  '^https://github\.com/SoBatista/sobatista-terminal/compare/v0\.1\.0\.\.\.HEAD$',
]
