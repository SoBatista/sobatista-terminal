name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install shell test dependencies
        run: |
          sudo apt-get update
          # ripgrep powers scripts/check-secrets.sh; python3-configobj is
          # Terminator's own config parser used by tests/terminator.bats
          # (Ubuntu 24.04 ships configobj 5.0.x).
          sudo apt-get install --yes bats shellcheck shfmt ripgrep python3-configobj

      - name: Install pinned Starship
        env:
          STARSHIP_VERSION: "1.26.0"
          # Upstream release checksum (…/v1.26.0/*.tar.gz.sha256); verified below.
          STARSHIP_SHA256: "321f0dd7af8340a5f2e6a8fec6538a04f617486f9ec70d878f91c09cd8deef22"
        run: |
          url="https://github.com/starship/starship/releases/download/v${STARSHIP_VERSION}/starship-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o /tmp/starship.tar.gz "$url"
          echo "${STARSHIP_SHA256}  /tmp/starship.tar.gz" | sha256sum --check --strict
          sudo tar -xzf /tmp/starship.tar.gz -C /usr/local/bin starship
          starship --version

      - name: Verify the real-tool test toolchain is complete
        run: |
          for tool in bats shellcheck shfmt rg starship; do
            command -v "$tool" >/dev/null \
              || { echo "::error::required test tool missing: $tool"; exit 1; }
          done
          python3 -c 'import configobj' \
            || { echo "::error::python3 configobj (Terminator parser) missing"; exit 1; }

      - name: Run full repository self-test
        run: scripts/self-test.sh

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.17.2 "**/*.md"

      - name: Validate GitHub Actions
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint:1.7.12 -color

      - name: Check links
        run: |
          # lychee 0.24.2
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --config .lychee.toml --no-progress .

  release-metadata:
    name: release metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch the pull request base ref
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Validate one exact SemVer increment
        env:
          RELEASE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: scripts/check-version.sh --pr "origin/${{ github.base_ref }}"

  distro-smoke:
    name: smoke (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
          - name: Fedora 44
            image: fedora:44
          - name: Arch Linux
            image: archlinux:base
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install configuration and validate the loaded shell
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          # --tty gives the interactive shell a controlling terminal so job
          # control initialises cleanly (no "no job control" noise), and
          # --rcfile loads the *installed* .bashrc (which sources .bash_aliases)
          # instead of --norc, which previously disabled what the test checks.
          docker run --rm --tty \
            --user 1000:1000 \
            --env HOME=/tmp/sobatista-home \
            --volume "$PWD:/repo:ro" \
            --workdir /tmp \
            "$IMAGE" \
            bash -c '
              set -e
              mkdir -p "$HOME"
              bash /repo/install.sh --configs-only --yes
              bash -n "$HOME/.bashrc" "$HOME/.bash_aliases"
              TERM=dumb bash --noprofile --rcfile "$HOME/.bashrc" -ic "
                [[ \$(type -t termhelp) == function ]] &&
                [[ \$(type -t q) == function ]] &&
                alias gup >/dev/null
              "
            '
