name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: secrets and sensitive data
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install security scan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Run repository-specific sensitive-data checks
        run: scripts/check-secrets.sh

      - name: Scan Git history with Gitleaks
        run: |
          # Gitleaks v8.24.3 takes the repository as a positional argument;
          # the removed --repo-path flag would fail with "unknown flag".
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.24.3 \
            git --redact --no-banner /repo
