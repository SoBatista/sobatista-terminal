name: Feature request
description: Propose a focused, portable improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What supported workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Distribution scope
      options:
        - All supported families
        - Debian / Ubuntu / Linux Mint
        - Fedora
        - Arch Linux
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, rollback, and testing impact
    validations:
      required: true
