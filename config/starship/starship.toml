"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
palette = "black_ice"

# One connected Black Ice Powerline bar kept on a single line so no separator or
# module can ever be orphaned. Identity sits on the surface shade; the rounded
# transition hands off to the secondary shade shared by directory, Git, and any
# language or container context, so the bar stays seamless whether or not those
# conditional modules are present. Every conditional module renders nothing when
# empty, so there are no placeholder capsules. The prompt character is on line 2.
format = "[](fg:surface)$os$env_var[](fg:surface bg:secondary)$directory$git_branch$git_status$c$rust$golang$nodejs$bun$php$java$kotlin$haskell$python$docker_context$conda[](fg:secondary)$cmd_duration$line_break$status$character"

[os]
disabled = false
style = "bg:surface fg:green"
format = "[ $symbol]($style)"

[os.symbols]
Arch = "󰣇"
Debian = "󰣚"
Fedora = "󰣛"
Linux = "󰌽"
Mint = "󰣭"
Ubuntu = "󰕈"

# Identity comes from the shell as SOBATISTA_PROMPT_IDENTITY so that
# SOBATISTA_SCREENSHOT_MODE can substitute a safe "sobatista@blackice" identity
# without exposing the real username or hostname. See config/bash/bashrc.
[env_var.SOBATISTA_PROMPT_IDENTITY]
variable = "SOBATISTA_PROMPT_IDENTITY"
default = "shell"
style = "bg:surface fg:green"
format = "[ $env_value ]($style)"

[directory]
style = "bg:secondary fg:cyan"
format = "[ 󰉋 $path$read_only ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "bg:secondary fg:warning"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = "󰇚 "
"Music" = "󰝚 "
"Pictures" = "󰋩 "
"Developer" = "󰲋 "
"Projects" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:secondary fg:green"
format = "[ $symbol $branch ]($style)"

# Only meaningful state renders. Clean repositories show the branch alone; every
# counter appears only when non-zero. Conflicts and divergence use error red, a
# dirty working tree uses warning amber, progress uses restrained green, and
# untracked or stashed context stays muted slate.
[git_status]
style = "bg:secondary fg:text"
format = "([ $all_status$ahead_behind ]($style))"
conflicted = "[=${count}](bold fg:error bg:secondary)"
ahead = "[⇡${count}](fg:green bg:secondary)"
behind = "[⇣${count}](fg:muted bg:secondary)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bold fg:error bg:secondary)"
up_to_date = ""
untracked = "[?${count}](fg:muted bg:secondary)"
stashed = "[*${count}](fg:muted bg:secondary)"
modified = "[!${count}](fg:warning bg:secondary)"
staged = "[+${count}](fg:green bg:secondary)"
renamed = "[»${count}](fg:cyan bg:secondary)"
deleted = "[✘${count}](bold fg:error bg:secondary)"

[c]
style = "bg:secondary fg:cyan"
format = "[ $symbol( $version) ]($style)"

[rust]
style = "bg:secondary fg:cyan"
format = "[ $symbol( $version) ]($style)"

[golang]
style = "bg:secondary fg:cyan"
format = "[ $symbol( $version) ]($style)"

[nodejs]
style = "bg:secondary fg:cyan"
format = "[ $symbol( $version) ]($style)"

[bun]
style = "bg:secondary fg:cyan"
format = "[ $symbol( $version) ]($style)"

[php]
style = "bg:secondary fg:cyan"
format = "[ $symbol( $version) ]($style)"

[java]
style = "bg:secondary fg:cyan"
format = "[ $symbol( $version) ]($style)"

[kotlin]
style = "bg:secondary fg:cyan"
format = "[ $symbol( $version) ]($style)"

[haskell]
style = "bg:secondary fg:cyan"
format = "[ $symbol( $version) ]($style)"

[python]
style = "bg:secondary fg:cyan"
format = '[ $symbol( $version)((#$virtualenv)) ]($style)'

[docker_context]
style = "bg:secondary fg:teal"
format = "[ $symbol( $context) ]($style)"

[conda]
style = "bg:secondary fg:teal"
format = "[ $symbol $environment ]($style)"
ignore_base = true

# The clock is intentionally removed from every mode. Do not re-enable it.
[time]
disabled = true

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:muted"
format = "[  $duration]($style)"

[line_break]
disabled = false

# The exit code appears only after a failing command; success stays clean and is
# signalled by the green prompt character alone.
[status]
disabled = false
success_symbol = ""
symbol = "✘ "
not_executable_symbol = "✘ "
not_found_symbol = "✘ "
sigint_symbol = "✘ "
signal_symbol = "✘ "
format = "[$symbol$status ]($style)"
style = "bold fg:error"
map_symbol = true

[character]
disabled = false
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:green)"
vimcmd_replace_one_symbol = "[❮](bold fg:warning)"
vimcmd_replace_symbol = "[❮](bold fg:warning)"
vimcmd_visual_symbol = "[❮](bold fg:cyan)"

[palettes.black_ice]
background = "#070B0D"
surface = "#111820"
secondary = "#18222C"
green = "#00E68A"
cyan = "#5EEBFF"
teal = "#22C7A9"
text = "#D6E7E9"
muted = "#64748B"
warning = "#F5C451"
error = "#FF4D5A"
