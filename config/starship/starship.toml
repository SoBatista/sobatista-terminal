"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
palette = "black_ice"

# The identity and directory are always present. Every optional module below
# owns both sides of its capsule so an empty module cannot leave an orphaned
# separator.
format = """
[](fg:surface)$os$username$hostname[](bg:secondary fg:surface)$directory[](fg:secondary)\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$time\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "bg:surface fg:green"
format = "[ $symbol]($style)"

[os.symbols]
Arch = "󰣇"
Debian = "󰣚"
Fedora = "󰣛"
Linux = "󰌽"
Mint = "󰣭"
Ubuntu = "󰕈"

[username]
show_always = true
style_user = "bg:surface fg:green"
style_root = "bold bg:surface fg:error"
format = "[ $user]($style)"

[hostname]
ssh_only = false
style = "bg:surface fg:green"
format = "[@$hostname ]($style)"

[directory]
style = "bg:secondary fg:cyan"
format = "[ 󰉋 $path$read_only ]($style)"
truncation_length = 4
truncation_symbol = "…/"
read_only = ""
read_only_style = "bg:secondary fg:warning"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "
"Projects" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:surface fg:green"
format = " [](fg:surface)[ $symbol $branch ]($style)[](fg:surface)"

[git_status]
style = "bg:surface fg:text"
format = " [](fg:surface)[ $all_status$ahead_behind ]($style)[](fg:surface)"
conflicted = "[=${count}](bold fg:error)"
ahead = "[⇡${count}](fg:green)"
behind = "[⇣${count}](fg:muted)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bold fg:error)"
up_to_date = ""
untracked = "[?${count}](fg:warning)"
stashed = "[*${count}](fg:muted)"
modified = "[!${count}](fg:warning)"
staged = "[+${count}](fg:green)"
renamed = "[»${count}](fg:cyan)"
deleted = "[✘${count}](fg:error)"

[c]
symbol = ""
style = "bg:surface fg:cyan"
format = " [](fg:surface)[ $symbol( $version) ]($style)[](fg:surface)"

[rust]
symbol = ""
style = "bg:surface fg:cyan"
format = " [](fg:surface)[ $symbol( $version) ]($style)[](fg:surface)"

[golang]
symbol = ""
style = "bg:surface fg:cyan"
format = " [](fg:surface)[ $symbol( $version) ]($style)[](fg:surface)"

[nodejs]
symbol = ""
style = "bg:surface fg:cyan"
format = " [](fg:surface)[ $symbol( $version) ]($style)[](fg:surface)"

[bun]
symbol = ""
style = "bg:surface fg:cyan"
format = " [](fg:surface)[ $symbol( $version) ]($style)[](fg:surface)"

[php]
symbol = ""
style = "bg:surface fg:cyan"
format = " [](fg:surface)[ $symbol( $version) ]($style)[](fg:surface)"

[java]
symbol = ""
style = "bg:surface fg:cyan"
format = " [](fg:surface)[ $symbol( $version) ]($style)[](fg:surface)"

[kotlin]
symbol = ""
style = "bg:surface fg:cyan"
format = " [](fg:surface)[ $symbol( $version) ]($style)[](fg:surface)"

[haskell]
symbol = ""
style = "bg:surface fg:cyan"
format = " [](fg:surface)[ $symbol( $version) ]($style)[](fg:surface)"

[python]
symbol = ""
style = "bg:surface fg:cyan"
format = ' [](fg:surface)[ $symbol( $version)((#$virtualenv)) ]($style)[](fg:surface)'

[docker_context]
symbol = ""
style = "bg:surface fg:teal"
format = " [](fg:surface)[ $symbol( $context) ]($style)[](fg:surface)"

[conda]
symbol = ""
style = "bg:surface fg:teal"
format = " [](fg:surface)[ $symbol $environment ]($style)[](fg:surface)"
ignore_base = true

[time]
disabled = false
time_format = "%R"
style = "bg:surface fg:muted"
format = " [](fg:surface)[  $time ]($style)[](fg:surface)"

[cmd_duration]
disabled = false
min_time = 1000
show_milliseconds = false
style = "fg:muted"
format = " [ $duration]($style)"
show_notifications = true
min_time_to_notify = 45000

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:green)"
vimcmd_replace_one_symbol = "[❮](bold fg:warning)"
vimcmd_replace_symbol = "[❮](bold fg:warning)"
vimcmd_visual_symbol = "[❮](bold fg:cyan)"

[palettes.black_ice]
background = "#070B0D"
surface = "#111820"
secondary = "#18222C"
green = "#00E68A"
cyan = "#5EEBFF"
teal = "#22C7A9"
text = "#D6E7E9"
muted = "#64748B"
warning = "#F5C451"
error = "#FF4D5A"
